<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate's Dice Duel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Pirata+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <header class="game-header">
            <h1>Pirate's Dice Duel</h1>
            <div class="balance-display">
                <span class="label">Doubloons:</span>
                <span id="player-balance" class="value">1000</span>
            </div>
        </header>

        <main class="game-area">
            <div class="dueling-ground">
                <!-- Opponent Side -->
                <div class="player-zone opponent">
                    <div class="avatar-container">
                        <img src="assets/avatar_opponent.png" alt="Davy Jones" class="avatar-img">
                        <div class="player-name">Davy Jones</div>
                    </div>
                    <div class="dice-container" id="opponent-dice-container">
                        <div class="die" id="opp-die-1">?</div>
                        <div class="die" id="opp-die-2">?</div>
                    </div>
                    <div class="score-display">Score: <span id="opponent-score">-</span></div>
                </div>

                <div class="divider">
                    <span class="vs-badge">VS</span>
                </div>

                <!-- Player Side -->
                <div class="player-zone player">
                    <div class="score-display">Score: <span id="player-score">-</span></div>
                    <div class="dice-container" id="player-dice-container">
                        <div class="die" id="player-die-1" data-value="?"></div>
                        <div class="die" id="player-die-2" data-value="?"></div>
                    </div>
                    <div class="avatar-container">
                        <img src="assets/avatar_player.png" alt="You" class="avatar-img">
                        <div class="player-name">You</div>
                        <div class="status-badge hidden" id="game-result-badge">WINNER</div>
                    </div>
                </div>
            </div>

            <div class="controls-area">
                <div class="betting-controls">
                    <div class="bet-input-group">
                        <label for="bet-amount">Wager</label>
                        <input type="number" id="bet-amount" value="10" min="1" max="1000">
                    </div>
                    <div class="quick-bets">
                        <button class="chip-btn" data-value="10">10</button>
                        <button class="chip-btn" data-value="50">50</button>
                        <button class="chip-btn" data-value="100">100</button>
                        <button class="chip-btn" data-value="max">MAX</button>
                    </div>
                    <div id="payout-info" class="payout-info"></div>
                </div>

                <div class="timer-container">
                    <div class="timer-label">Next Round In</div>
                    <div class="timer-bar-bg">
                        <div id="timer-bar" class="timer-bar-fill"></div>
                    </div>
                    <div id="timer-text" class="timer-text">10s</div>
                </div>
            </div>
        </main>

        <div id="message-log" class="message-log">
            <p>Welcome to the Captain's Table...</p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
